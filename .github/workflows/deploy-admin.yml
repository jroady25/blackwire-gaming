name: Deploy BlackWire admin panel

# Manual only for now — flip to `push: { branches: [main], paths: ['admin/**'] }`
# once the one-time migration steps in admin/README.md are done (copying
# SERVICE_ALLOWLIST / NAME_EXCLUDE / CLUSTERS into admin/wrangler.toml, and
# adding the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets).
# Deploying before then would overwrite those three vars on the live Worker.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
