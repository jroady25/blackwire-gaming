name = "blackwire-admin"
main = "src/worker.js"
compatibility_date = "2026-09-14"

# Static dashboard (index.html / styles.css / app.js) served via the
# ASSETS binding referenced in src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Sessions, login rate-limiting, scheduled-action jobs, and the audit log
# all live in this KV namespace. Id copied from the live Worker — do not
# change it, or a fresh (empty) namespace will be created instead.
[[kv_namespaces]]
binding = "STORE"
id = "8738ebd9dfc04d27a4a9a1cc6563bdfc"

# Fires scheduled() in src/worker.js, which checks for any due delayed
# restart/stop/start jobs and runs them. Each scheduled() call does a KV
# list() against the sched: prefix, even when nothing is due — at every
# minute that was 1,440 list ops/day, over Cloudflare's free 1,000/day KV
# list cap (hit 90% on 2026-09-14). Slowed to every 5 minutes (~288/day)
# to stay well under it; scheduled restarts now fire within ~5 min of
# their target time instead of ~1 min.
[triggers]
crons = ["*/5 * * * *"]

# Mounts the panel at blackwiregaming.com/admin instead of serving from
# the workers.dev root. src/worker.js reads this at request time.
[vars]
BASE_PATH = "/admin"
SERVICE_ALLOWLIST = ""
NAME_EXCLUDE = "trixter"
CLUSTERS = '''[{"name": "Palworld", "match": ["palworld"]}, {"name": "BlackWire", "match": ["blackwire", "ark"]}]'''

# --------------------------------------------------------------------
# NOT included here on purpose, and why:
#
# NITRADO_TOKEN / SESSION_SECRET / ADMIN_PASSWORD / DISCORD_CLIENT_ID /
# DISCORD_CLIENT_SECRET / DISCORD_GUILD_ID / DISCORD_ADMIN_ROLE_IDS /
# NITRADO_BASE_URL / GH_DISPATCH_TOKEN
#   Worker secrets (`wrangler secret put ...`), set directly in
#   Cloudflare and never written to a file. A normal `wrangler deploy`
#   does not touch existing secrets, so these stay put across this
#   migration with nothing to do.
#
#   GH_DISPATCH_TOKEN specifically (added 2026-09-15, not yet set): a
#   GitHub token used by scheduled() in src/worker.js to reliably kick
#   off the public site's poll-servers.yml workflow every 5 minutes,
#   since GitHub's own schedule: trigger for that workflow has proven
#   unreliable. Create a fine-grained GitHub PAT scoped to ONLY the
#   jroady25/blackwire-gaming repo with "Actions: Read and write"
#   permission and nothing else, then set it with
#   `wrangler secret put GH_DISPATCH_TOKEN` (or via the Cloudflare
#   dashboard: blackwire-admin -> Settings -> Variables -> add a
#   secret). Until it's set, dispatchStatusPoll() silently no-ops, so
#   this is safe to have deployed already.
#
# Workers Route (blackwiregaming.com/admin*)
#   Routes aren't declared in this file by default in this setup: the
#   live Worker already has a route bound to it in the dashboard
#   (Workers & Pages -> blackwire-admin -> Settings -> Domains & Routes),
#   and `wrangler deploy` leaves existing routes alone unless you add a
#   [[routes]] block here. Nothing to do for this migration; add one
#   only if you want the route itself managed from this file going
#   forward, e.g.:
#     [[routes]]
#     pattern = "blackwiregaming.com/admin*"
#     zone_name = "blackwiregaming.com"
# --------------------------------------------------------------------
