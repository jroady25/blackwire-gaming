name: Deploy BlackWire admin panel

# Deploys automatically whenever admin/** changes land on main. The
# one-time migration steps in admin/README.md are done (SERVICE_ALLOWLIST /
# NAME_EXCLUDE / CLUSTERS are set in admin/wrangler.toml, and the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are in place) —
# a manual workflow_dispatch test run deployed cleanly on 2026-09-14.
on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          # Copies the PvP admin password from this repo's GitHub secret onto
          # the Worker, so the panel's Broadcast / Who's on / kick work on the
          # PvP servers. The value never touches a file in the repo.
          secrets: |
            ARK_RCON_PASSWORD_PVP
        env:
          ARK_RCON_PASSWORD_PVP: ${{ secrets.ARK_RCON_PASSWORD_PVP }}
